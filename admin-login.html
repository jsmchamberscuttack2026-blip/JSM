<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | JSM. Chambers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(rgba(10, 25, 47, 0.95), rgba(10, 25, 47, 0.95)), url('assets/images/hero-bg.jpg') center/cover;
        }
        .login-card {
            background: var(--color-white);
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #4CAF50; /* Different color for admin distinction */
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .login-links {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .login-links a {
            color: var(--color-primary);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <h1>JSM. <span>Chambers</span></h1>
            </a>
            <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Back to Home</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Admin Portal</h2>
            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" for="admin-id">Admin ID / Email</label>
                    <input type="text" id="admin-id" class="form-control" required placeholder="e.g. admin@jsmchambers.demo">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
                <div class="form-check">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="font-size: 0.9rem;">Remember Me</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" style="width: 100%; margin-top: 1rem; background-color: #172A45;">Admin Login</button>

                <div class="login-links">
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
            <div style="margin-top: 2rem; font-size: 0.8rem; color: #999; text-align: center;">
                
            </div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password === 'admin123') {
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid password. Please use: admin123');
            }
        });
    </script>
</body>
</html>
