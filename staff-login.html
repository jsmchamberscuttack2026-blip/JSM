<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | JSM. Chambers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(rgba(16, 42, 67, 0.95), rgba(16, 42, 67, 0.95)), url('assets/images/hero-bg.jpg') center/cover; }
        .login-card { background: var(--color-white); padding: 3rem; border-radius: var(--radius); box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; border-top: 5px solid #d4af37; }
        .login-card h2 { text-align: center; margin-bottom: 2rem; }
        .form-check { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .login-links { display: flex; justify-content: space-between; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-links a { color: var(--color-primary); font-weight: 500; }
        .subtitle { font-size: 0.9rem; color: #555; margin-bottom: 1rem; text-align: center; }
    </style>
    <meta name="google-site-verification" content="Cb6ak0wetmxY9fGq95lyGFJI2XIfWpdpoZRLJ_e-4RY" />
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
                <h1>JSM. <span>Chambers</span></h1>
            </a>
            <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">Back to Home</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="portal-logo" src="" style="max-height: 80px; max-width: 200px; border-radius: 6px; display: none; margin: 0 auto;">
                <h2 style="margin-top: 15px; margin-bottom: 0;">Staff Portal</h2>
            </div>

            <div id="error-msg" style="display: none; background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px;"></div>
            
            

            <form id="forgot-form">
                <div class="subtitle">Enter your registered staff email. We will send you a 6-digit verification code to log in.</div>
                <div class="form-group">
                    <label class="form-label" for="forgot-email">Registered Email</label>
                    <input type="email" id="forgot-email" class="form-control" placeholder="staff@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="request-code-btn" style="width: 100%; background-color: #102a43; transition: 0.3s;">Request Verification Code</button>
                <div class="login-links" style="justify-content: center;">
                    <a href="index.html">&larr; Back to Home</a>
                </div>
            </form>

            <form id="verify-form" style="display: none;">
                <div class="subtitle">We sent a 6-digit code to your email. Enter it below.</div>
                
                <div style="text-align: center; margin-bottom: 15px; font-weight: bold; color: #e74c3c;">
                    Code expires in: <span id="timer-display">30</span>s
                </div>

                <div class="form-group">
                    <label class="form-label" for="verify-code">Verification Code</label>
                    <input type="text" id="verify-code" class="form-control" placeholder="123456" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="verify-code-btn" style="width: 100%; background-color: #102a43; transition: 0.3s;">Verify & Login</button>
                <div class="login-links" style="justify-content: center;">
                    <a href="#" id="cancel-verify-btn">&larr; Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgot-form');
        const verifyForm = document.getElementById('verify-form');
        const errorMsg = document.getElementById('error-msg');
        let tempEmail = "";
        let timerInterval = null;
        let lockoutInterval = null;

        function showLockoutAlert(remSeconds, customMsg) {
            clearInterval(timerInterval);
            clearInterval(lockoutInterval);
            
            let remaining = remSeconds || 300;
            const verifyBtn = document.getElementById('verify-code-btn');
            const requestBtn = document.getElementById('request-code-btn');
            const verifyCodeInput = document.getElementById('verify-code');
            
            if (verifyBtn) verifyBtn.disabled = true;
            if (requestBtn) requestBtn.disabled = true;
            if (verifyCodeInput) verifyCodeInput.disabled = true;

            const updateDisplay = () => {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fef2f2';
                errorMsg.style.border = '1.5px solid #ef4444';
                errorMsg.style.color = '#991b1b';
                errorMsg.style.padding = '14px';
                errorMsg.style.borderRadius = '8px';
                errorMsg.style.textAlign = 'center';
                errorMsg.innerHTML = `
                    <div style="font-weight: 800; font-size: 15px; margin-bottom: 5px;">🔒 Staff Account Locked</div>
                    <div style="font-size: 13px; line-height: 1.45; color: #7f1d1d; margin-bottom: 8px;">
                        ${customMsg || 'Entered incorrect verification code 4 times. This staff account is temporarily locked for 5 minutes.'}
                    </div>
                    <div style="background: rgba(239, 68, 68, 0.12); border-radius: 6px; padding: 6px 12px; display: inline-block;">
                        <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #b91c1c;">Lockout expires in:</span>
                        <span style="font-family: monospace; font-size: 17px; font-weight: 800; color: #dc2626; margin-left: 6px;">${timeStr}</span>
                    </div>
                `;
            };

            updateDisplay();

            lockoutInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(lockoutInterval);
                    if (verifyBtn) { verifyBtn.disabled = false; verifyBtn.innerText = 'Verify & Login'; }
                    if (requestBtn) { requestBtn.disabled = false; requestBtn.innerText = 'Request Verification Code'; }
                    if (verifyCodeInput) { verifyCodeInput.disabled = false; verifyCodeInput.value = ''; }

                    errorMsg.style.background = '#f0fdf4';
                    errorMsg.style.border = '1.5px solid #22c55e';
                    errorMsg.style.color = '#15803d';
                    errorMsg.innerHTML = `<strong>✓ 5-Minute Lockout Expired</strong><br><span style="font-size: 13px;">You can now request a fresh verification code to log in.</span>`;
                    
                    // Switch back to request code form
                    verifyForm.style.display = 'none';
                    forgotForm.style.display = 'block';
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            tempEmail = document.getElementById('forgot-email').value.trim();
            const btn = document.getElementById('request-code-btn');
            btn.innerText = 'Sending Code...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/staff-forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: tempEmail })
                });
                const data = await response.json();

                if (response.ok) {
                    forgotForm.style.display = 'none';
                    verifyForm.style.display = 'block';
                    
                    let timeLeft = 60;
                    const timerDisplay = document.getElementById('timer-display');
                    const verifyBtn = document.getElementById('verify-code-btn');
                    const verifyCodeInput = document.getElementById('verify-code');
                    verifyCodeInput.disabled = false;
                    verifyCodeInput.value = '';
                    verifyCodeInput.focus();
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = 'Verify & Login';
                    timerDisplay.innerText = timeLeft;
                    
                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        timerDisplay.innerText = timeLeft;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            verifyBtn.disabled = true;
                            verifyBtn.innerText = 'Code Expired';
                            errorMsg.style.display = 'block';
                            errorMsg.style.background = '#fee2e2';
                            errorMsg.style.border = '1px solid #f87171';
                            errorMsg.style.color = '#b91c1c';
                            errorMsg.innerText = 'Verification code has expired. Please go back and request a new one.';
                        }
                    }, 1000);
                } else if (response.status === 423 || data.locked) {
                    showLockoutAlert(data.lockout_remaining_seconds || 300, data.error);
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.style.background = '#fee2e2';
                    errorMsg.style.border = '1px solid #f87171';
                    errorMsg.style.color = '#b91c1c';
                    errorMsg.innerText = data.error || 'Failed to send code';
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fee2e2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#b91c1c';
                errorMsg.innerText = 'Server error. Please try again.';
            }
            if (!lockoutInterval) {
                btn.innerText = 'Request Verification Code';
                btn.disabled = false;
            }
        });

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('verify-code').value.trim();
            const btn = document.getElementById('verify-code-btn');
            btn.innerText = 'Verifying...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/staff-verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: tempEmail, code })
                });
                const data = await response.json();

                if (response.ok) {
                    clearInterval(timerInterval);
                    clearInterval(lockoutInterval);
                    sessionStorage.setItem('staffLoggedIn', 'true');
                    sessionStorage.setItem('staffData', JSON.stringify(data.advocate));
                    window.location.href = 'staff-dashboard.html';
                } else if (response.status === 423 || data.locked) {
                    showLockoutAlert(data.lockout_remaining_seconds || 300, data.error);
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.style.background = '#fef2f2';
                    errorMsg.style.border = '1px solid #f87171';
                    errorMsg.style.color = '#991b1b';
                    errorMsg.style.padding = '12px';
                    errorMsg.style.borderRadius = '6px';
                    
                    let attemptsWarning = '';
                    if (data.attempts_left !== undefined) {
                        attemptsWarning = `<div style="margin-top: 5px; font-size: 12px; color: #dc2626; font-weight: 600;">⚠️ 4 incorrect attempts will lock this account for 5 minutes.</div>`;
                    }
                    errorMsg.innerHTML = `<div style="font-weight: 600;">${data.error || 'Invalid verification code.'}</div>${attemptsWarning}`;
                    
                    btn.innerText = 'Verify & Login';
                    btn.disabled = false;
                    const verifyCodeInput = document.getElementById('verify-code');
                    if (verifyCodeInput) {
                        verifyCodeInput.select();
                        verifyCodeInput.focus();
                    }
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fee2e2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#b91c1c';
                errorMsg.innerText = 'Server error. Please try again.';
                btn.innerText = 'Verify & Login';
                btn.disabled = false;
            }
        });
        
        document.getElementById('cancel-verify-btn').addEventListener('click', (e) => {
            e.preventDefault();
            clearInterval(timerInterval);
            verifyForm.style.display = 'none';
            forgotForm.style.display = 'block';
            if (!lockoutInterval) {
                errorMsg.style.display = 'none';
            }
        });
    </script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/settings');
            const settings = await res.json();
            if (settings.logoUrl) {
                const topLogo = document.getElementById('portal-logo');
                
                if(topLogo) { topLogo.src = settings.logoUrl; topLogo.style.display = 'block'; }
                
            }
        } catch(e) {}
    });
</script>
</body>
</html>
