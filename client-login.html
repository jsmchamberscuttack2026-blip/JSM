<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSM Chambers | Client Portal</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 20%,#263f5b 0,transparent 35%),
      linear-gradient(135deg,#071522,#102b45);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#182536;
}

.wrapper{
    width:460px;
    max-width:92%;
}

.brand{
    text-align:center;
    color:#d2ae67;
    font-weight:800;
    letter-spacing:4px;
    font-size:14px;
    margin-bottom:18px;
}

.card{
    background:rgba(255,255,255,.98);
    padding:42px;
    border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.security{
    width:58px;
    height:58px;
    border-radius:16px;
    background:#edf4f8;
    display:grid;
    place-items:center;
    font-size:27px;
    margin:0 auto 22px;
}

h1{
    text-align:center;
    margin:0;
    font-family:Georgia,serif;
    font-size:31px;
}

.subtitle{
    text-align:center;
    color:#718096;
    margin:10px 0 30px;
    font-size:14px;
    line-height: 1.5;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin:18px 0 7px;
}

.field{
    position:relative;
}

input{
    width:100%;
    padding:15px 16px;
    border:1px solid #d8dee7;
    border-radius:11px;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:#173b5c;
    box-shadow:0 0 0 4px #173b5c12;
}

.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    cursor:pointer;
    font-size:17px;
}

.login{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:0;
    border-radius:11px;
    background:#0c2942;
    color:white;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.login:hover{
    transform:translateY(-1px);
    background:#123b5d;
}

.links{
    text-align:center;
    margin-top:22px;
    font-size:13px;
}

.links a{
    color:#9a7538;
    text-decoration:none;
    font-weight:600;
}

.divider{
    margin:20px 0;
    border-top:1px solid #edf0f3;
}

.footer{
    text-align:center;
    font-size:11px;
    color:#98a2b3;
    margin-top:20px;
}

.error{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#fff1f1;
    color:#b42318;
    border-radius:9px;
    font-size:13px;
    text-align:center;
}
</style>
    <meta name="google-site-verification" content="Cb6ak0wetmxY9fGq95lyGFJI2XIfWpdpoZRLJ_e-4RY" />
</head>

<body>

<div class="wrapper">

<div class="brand" id="portal-brand-container" style="display: flex; flex-direction: column; align-items: center;">
    <img id="portal-logo" src="" style="height: 60px; display: none; margin-bottom: 15px; border-radius: 4px;">
    <span id="portal-title">JSM. CHAMBERS</span>
</div>

<div class="card">

<div class="security">🔐</div>

<h1>Client Portal</h1>



<!-- FORGOT PASSWORD FORM -->
<form id="forgot-form">
    <div class="subtitle">Enter your registered email and we will send you a 6-digit verification code to log in.</div>
    
    <label>Registered Email ID</label>
    <input type="email" id="forgot-email" placeholder="client@example.com" required>
    
    <button type="submit" class="login" id="request-code-btn">Request Verification Code</button>
    
    <div class="divider"></div>
    <div class="links">
        
    </div>
</form>

<!-- VERIFY CODE FORM -->
<form id="verify-form" style="display: none;">
    <div class="subtitle" style="margin-bottom: 15px;">We sent a 6-digit verification code to your email. Enter it below to access your case file.</div>
    
    <div id="client-security-report" style="display: none; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 9px; padding: 12px; margin-bottom: 18px; font-size: 13px; color: #1e40af; text-align: center; line-height: 1.45;">
    </div>
    
    <label>Verification Code</label>
    <input type="text" id="verify-code" placeholder="123456" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
    
    <button type="submit" class="login" id="verify-code-btn">Verify & Login</button>
    
    <div class="divider"></div>
    <div class="links">
        <a href="#" id="cancel-verify-btn">&larr; Back to Email Login</a>
    </div>
</form>

<div id="error-msg" class="error"></div>

<div class="footer">
🔒 Secure & Confidential · Authorized Clients Only
</div>

</div>
</div>

<script>
    function togglePassword(){
        const password = document.getElementById("password");
        password.type = password.type === "password" ? "text" : "password";
    }

    const loginForm = document.getElementById('login-form');
    const forgotForm = document.getElementById('forgot-form');
    const verifyForm = document.getElementById('verify-form');
    const errorMsg = document.getElementById('error-msg');
    let tempEmail = "";
    let clientLockoutInterval = null;

    function showClientLockoutAlert(remSeconds, customMsg) {
        clearInterval(clientLockoutInterval);
        let remaining = remSeconds || 300;
        
        const verifyBtn = document.getElementById('verify-code-btn');
        const requestBtn = document.getElementById('request-code-btn');
        const verifyCodeInput = document.getElementById('verify-code');
        const forgotEmailInput = document.getElementById('forgot-email');
        
        if (verifyBtn) verifyBtn.disabled = true;
        if (requestBtn) requestBtn.disabled = true;
        if (verifyCodeInput) verifyCodeInput.disabled = true;
        if (forgotEmailInput) forgotEmailInput.disabled = true;

        const updateDisplay = () => {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            const timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            errorMsg.style.display = 'block';
            errorMsg.style.background = '#fef2f2';
            errorMsg.style.border = '1.5px solid #ef4444';
            errorMsg.style.color = '#991b1b';
            errorMsg.style.padding = '14px';
            errorMsg.style.borderRadius = '8px';
            errorMsg.style.textAlign = 'center';
            errorMsg.innerHTML = `
                <div style="font-weight: 800; font-size: 15px; margin-bottom: 5px;">🔒 Client Portal Locked (5 Minutes)</div>
                <div style="font-size: 13px; line-height: 1.45; color: #7f1d1d; margin-bottom: 8px;">
                    ${customMsg || 'Entered incorrect verification code 5 times. Access from your IP address is temporarily locked for 5 minutes.'}
                </div>
                <div style="background: rgba(239, 68, 68, 0.12); border-radius: 6px; padding: 6px 12px; display: inline-block;">
                    <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #b91c1c;">Lockout expires in:</span>
                    <span style="font-family: monospace; font-size: 17px; font-weight: 800; color: #dc2626; margin-left: 6px;">${timeStr}</span>
                </div>
            `;
        };

        updateDisplay();

        clientLockoutInterval = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(clientLockoutInterval);
                clientLockoutInterval = null;
                if (verifyBtn) { verifyBtn.disabled = false; verifyBtn.innerText = 'Verify & Login'; }
                if (requestBtn) { requestBtn.disabled = false; requestBtn.innerText = 'Request Verification Code'; }
                if (verifyCodeInput) { verifyCodeInput.disabled = false; verifyCodeInput.value = ''; }
                if (forgotEmailInput) { forgotEmailInput.disabled = false; }

                errorMsg.style.background = '#f0fdf4';
                errorMsg.style.border = '1.5px solid #22c55e';
                errorMsg.style.color = '#15803d';
                errorMsg.innerHTML = `<strong>✓ 5-Minute Lockout Expired</strong><br><span style="font-size: 13px;">You can now request a fresh verification code to log in.</span>`;
                
                verifyForm.style.display = 'none';
                forgotForm.style.display = 'block';
            } else {
                updateDisplay();
            }
        }, 1000);
    }

    document.getElementById('cancel-verify-btn').addEventListener('click', (e) => {
        e.preventDefault();
        verifyForm.style.display = 'none';
        forgotForm.style.display = 'block';
        if (!clientLockoutInterval) {
            errorMsg.style.display = 'none';
        }
    });

    // 2. Request Verification Code
    forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        tempEmail = document.getElementById('forgot-email').value.trim();
        const btn = document.getElementById('request-code-btn');
        const reportBox = document.getElementById('client-security-report');
        btn.innerText = 'Sending Code...';
        btn.disabled = true;
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: tempEmail })
            });
            const data = await response.json();

            if (response.ok) {
                forgotForm.style.display = 'none';
                verifyForm.style.display = 'block';
                const verifyCodeInput = document.getElementById('verify-code');
                if (verifyCodeInput) {
                    verifyCodeInput.disabled = false;
                    verifyCodeInput.value = '';
                    verifyCodeInput.focus();
                }
                const verifyBtn = document.getElementById('verify-code-btn');
                if (verifyBtn) {
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = 'Verify & Login';
                }
                if (reportBox) {
                    reportBox.style.display = 'block';
                    const rem = data.attempts_left !== undefined ? data.attempts_left : 0;
                    const dailyMax = data.daily_max || 3;
                    const bonus = data.bonus_otps || 0;
                    const attempt = data.count_today || (dailyMax - rem);
                    const remColor = rem > 1 ? '#15803d' : (rem === 1 ? '#b45309' : '#b91c1c');
                    const policyText = bonus > 0 
                        ? `(Special Emergency Access: Standard 3 + ${bonus} Bonus OTPs = ${dailyMax} Total for Today)`
                        : `(Policy: Maximum 3 login attempts per day per client)`;
                    reportBox.innerHTML = `<strong>📊 Security Activity Report:</strong><br>` +
                        `Verification code sent to <strong>${tempEmail}</strong>.<br>` +
                        `Current Attempt: <strong>#${attempt} of ${dailyMax}</strong> | Remaining: <strong style="color: ${remColor};">${rem} attempt(s) left today</strong><br>` +
                        `<small style="color: #64748b;">${policyText}</small>`;
                }
            } else if (response.status === 423 || data.locked) {
                showClientLockoutAlert(data.lockout_remaining_seconds || 300, data.error);
            } else if (response.status === 429 || data.limit_reached) {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fef2f2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#991b1b';
                errorMsg.innerHTML = `🚫 <strong>Daily Login Limit Reached:</strong><br>${data.error || 'You have exhausted your daily logins. If this is an emergency, contact Chamber Administration to grant Special OTP access.'}`;
            } else {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fee2e2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#b91c1c';
                errorMsg.innerText = data.error || 'Failed to send code. Please verify your email.';
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.style.background = '#fee2e2';
            errorMsg.style.border = '1px solid #f87171';
            errorMsg.style.color = '#b91c1c';
            errorMsg.innerText = 'Server error. Please try again.';
        }
        if (!clientLockoutInterval) {
            btn.innerText = 'Request Verification Code';
            btn.disabled = false;
        }
    });

    // 3. Verify Code and Login
    verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = document.getElementById('verify-code').value.trim();
        const btn = document.getElementById('verify-code-btn');
        btn.innerText = 'Verifying...';
        btn.disabled = true;
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: tempEmail, code: code })
            });
            const data = await response.json();

            if (response.ok) {
                clearInterval(clientLockoutInterval);
                localStorage.setItem('clientCaseId', data.case._id);
                window.location.href = 'client-dashboard.html';
            } else if (response.status === 423 || data.locked) {
                showClientLockoutAlert(data.lockout_remaining_seconds || 300, data.error);
            } else if (response.status === 429 || data.limit_reached) {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fef2f2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#991b1b';
                errorMsg.innerHTML = `🚫 <strong>Daily Login Limit Reached:</strong><br>${data.error || 'You cannot log in again today. Maximum 3 logins reached.'}`;
            } else {
                errorMsg.style.display = 'block';
                errorMsg.style.background = '#fef2f2';
                errorMsg.style.border = '1px solid #f87171';
                errorMsg.style.color = '#991b1b';
                errorMsg.style.padding = '12px';
                errorMsg.style.borderRadius = '6px';
                
                let warningNote = '';
                if (data.attempts_left !== undefined) {
                    warningNote = `<div style="margin-top: 5px; font-size: 12px; color: #dc2626; font-weight: 600;">⚠️ 5 incorrect attempts will lock access from your IP address for 5 minutes.</div>`;
                }
                errorMsg.innerHTML = `<div style="font-weight: 600;">${data.error || 'Invalid verification code. Please check your email.'}</div>${warningNote}`;
                
                const verifyCodeInput = document.getElementById('verify-code');
                if (verifyCodeInput) {
                    verifyCodeInput.select();
                    verifyCodeInput.focus();
                }
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.style.background = '#fee2e2';
            errorMsg.style.border = '1px solid #f87171';
            errorMsg.style.color = '#b91c1c';
            errorMsg.innerText = 'Server error. Please try again.';
        }
        if (!clientLockoutInterval) {
            btn.innerText = 'Verify & Login';
            btn.disabled = false;
        }
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // Check client IP lock status on page load
            const lockRes = await fetch('/api/client-lock-status');
            if (lockRes.ok) {
                const lockData = await lockRes.json();
                if (lockData.locked && lockData.remaining_seconds > 0) {
                    showClientLockoutAlert(lockData.remaining_seconds);
                }
            }
        } catch(e) {}

        try {
            const res = await fetch('/api/settings');
            const settings = await res.json();
            if (settings.logoUrl) {
                const topLogo = document.getElementById('portal-logo');
                const portalTitle = document.getElementById('portal-title');
                if(topLogo) { topLogo.src = settings.logoUrl; topLogo.style.display = 'block'; }
                if(portalTitle) { portalTitle.style.display = 'none'; }
            }
        } catch(e) {}
    });
</script>
</body>
</html>
